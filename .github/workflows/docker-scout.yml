name: Docker Scout Vulnerability Scan

on:
  push:
    tags: ["*"]
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'app/**'
      - '.github/workflows/docker-scout.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vagedis74/vagedis
  SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

jobs:
  build:
    name: Docker Scout Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
          tags: |
            type=edge,branch=$repo.default_branch
            type=semver,pattern=v{{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Scout - Quickview
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: quickview
          image: ${{ steps.meta.outputs.tags }}
          organization: vagedis74

      - name: Docker Scout - CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.meta.outputs.tags }}
          organization: vagedis74
          only-severities: critical,high
          only-fixed: true
          sarif-file: scout-results.sarif
          summary: true

      - name: Docker Scout - Recommendations
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: recommendations
          image: ${{ steps.meta.outputs.tags }}
          organization: vagedis74

      - name: Docker Scout - Compare on PR
        id: docker-scout
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ steps.meta.outputs.tags }}
          to-env: production
          ignore-unchanged: true
          only-severities: critical,high
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record to Scout environment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker scout environment production ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --org vagedis74 --platform linux/amd64 || true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-results.sarif
        continue-on-error: true
