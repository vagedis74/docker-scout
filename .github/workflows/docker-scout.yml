name: Docker Scout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # -----------------------------------------------------------
  # Job 1 — Build the repo image, push to ghcr.io, Scout scan
  # -----------------------------------------------------------
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Docker Hub login (required for Docker Scout) ----
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- ghcr.io login (for pushing images) ----
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      # On PRs:  load into local daemon (no push)
      # On main: push to ghcr.io
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Docker Scout CVE scan ----
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ steps.meta.outputs.tags }}
          sarif-file: scout-results.sarif
          summary: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: scout-results.sarif

      # ---- Docker Scout recommendations ----
      - name: Docker Scout recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: ${{ steps.meta.outputs.tags }}

      # ---- PR comment with Scout comparison ----
      - name: Docker Scout compare (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/scout-action@v1
        with:
          command: compare
          image: ${{ steps.meta.outputs.tags }}
          to: ${{ env.IMAGE_NAME }}:main
          exit-code: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------
  # Job 2 — Scan an external image (nginx:latest)
  # -----------------------------------------------------------
  scan-external-image:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull nginx:latest
        run: docker pull nginx:latest

      - name: Scout CVE scan — nginx:latest
        uses: docker/scout-action@v1
        with:
          command: cves
          image: nginx:latest
          sarif-file: nginx-scout.sarif
          summary: true

      - name: Upload SARIF — nginx:latest
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: nginx-scout.sarif
          category: external-nginx
